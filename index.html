<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMOCODEX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<link rel="icon" href="assets/icon192.png">
<link rel="apple-touch-icon" href="assets/icon180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DemoCodex">
<style>
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0;
    overflow-x: hidden;
    background: #000 url('assets/sfondo.jpg') center center / cover no-repeat fixed;
    font-family: Georgia, serif;
    color: #d4af37;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 40px 30px 30px;
    gap: 14px;
  }

  .title {
    margin: 0 0 30px 0;
    font-size: 64px;
    letter-spacing: 10px;
    font-weight: normal;
    color: #d4af37;
    text-shadow: 0 0 20px rgba(212,175,55,0.6), 0 0 40px rgba(212,175,55,0.3);
  }

  .row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    gap: 130px;
  }

  .panel-left {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 10px;
    flex: 0 0 auto;
  }
  .dot {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    cursor: pointer;
    background-size: cover;
    background-position: center;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .dot:hover {
    transform: scale(1.08);
  }
  .dot.selected {
    box-shadow: 0 0 12px rgba(255,255,255,0.9);
  }

  .stage {
    position: relative;
    width: 380px;
    max-width: 58vw;
    aspect-ratio: 410 / 670;
    flex: 0 0 auto;
  }
  .stage img.bg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .slot {
    position: absolute;
    width: 46px;
    height: 46px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
  }
  .slot .fill {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: transparent;
    background-size: cover;
    background-position: center;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .slot .fill.filled {
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.45);
  }

  .strip {
    width: 620px;
    max-width: 80vw;
    display: block;
  }

  .controls {
    display: flex;
    gap: 16px;
  }
  .btn {
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 1px;
    background: transparent;
    color: #d4af37;
    border: 1px solid #d4af37;
    border-radius: 4px;
    padding: 8px 22px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover {
    background: #d4af37;
    color: #000;
  }

  .poem-box {
    max-width: 500px;
    min-height: 24px;
    text-align: center;
    font-size: 16px;
    line-height: 1.6;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.4s;
    white-space: pre-line;
  }
  .poem-box.visible {
    opacity: 1;
  }
  .poem-box.error {
    font-style: normal;
    color: #a33;
  }
  .poem-image {
    max-width: 100%;
    max-height: 500px;
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 4px;
  }

  @media (max-width: 700px) {
    body { padding: 24px 16px 24px; background-attachment: scroll; }
    .title { font-size: 9vw; letter-spacing: 4px; margin-bottom: 16px; }
    .row { flex-direction: column; gap: 24px; }
    .panel-left { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
    .dot { width: 50px; height: 50px; }
    .stage { width: 300px; max-width: 78vw; }
    .strip { width: 90vw; }
  }
</style>
</head>
<body>

<h1 class="title">DEMOCODEX</h1>

<div class="row">
  <div class="panel-left" id="panel-left"></div>

  <div class="stage">
    <img class="bg" src="assets/copertina.png" alt="copertina libro">

    <div class="slot" id="slot-luna" style="left:50.5%; top:32.5%;"><div class="fill"></div></div>
    <div class="slot" id="slot-mercurio" style="left:29.0%; top:42.0%;"><div class="fill"></div></div>
    <div class="slot" id="slot-venere" style="left:71.2%; top:40.9%;"><div class="fill"></div></div>
    <div class="slot" id="slot-marte" style="left:37.3%; top:58.6%;"><div class="fill"></div></div>
    <div class="slot" id="slot-sole" style="left:63.5%; top:58.2%;"><div class="fill"></div></div>
  </div>
</div>

<img class="strip" src="assets/striscia.png" alt="striscia legenda">

<div class="controls">
  <button class="btn" id="btn-decifra">DECIFRA</button>
  <button class="btn" id="btn-reset">RESET</button>
</div>

<div class="poem-box" id="poem-box"></div>

<script>
  var colors = [
    "assets/rune1.png","assets/rune2.png","assets/rune3.png",
    "assets/rune4.png","assets/rune5.png","assets/rune6.png",
    "assets/rune7.png","assets/rune8.png","assets/rune9.png"
  ];

  var combinazioni = [
    { luna:1, mercurio:4, venere:4, marte:4, sole:1,
      immagine: "assets/carta-segreta.jpg" },
    { luna:0, mercurio:1, marte:6, sole:3,
      poesia: `Ci si improvvisa scrittori
dalla penna di loto
e gli occhi insaziabili
come fiumi in piena
per amore della poesia
si vive e si muore
con la lingua arrotolata tra i denti
con le dita che sbocciano come fiori
che si aprono al mondo intero
Non si è poeti
ma si sogna di esserlo

Mathias PdS` }
  ];

  var panel = document.getElementById('panel-left');
  var selectedIndex = null;
  var dots = [];
  var slotState = { luna: null, mercurio: null, venere: null, marte: null, sole: null };

  colors.forEach(function(c, i) {
    var d = document.createElement('div');
    d.className = 'dot';
    d.style.backgroundImage = "url(" + c + ")";
    d.dataset.index = i;
    d.addEventListener('click', function() {
      if (selectedIndex === i) {
        selectedIndex = null;
        d.classList.remove('selected');
      } else {
        dots.forEach(function(x) { x.classList.remove('selected'); });
        selectedIndex = i;
        d.classList.add('selected');
      }
    });
    panel.appendChild(d);
    dots.push(d);
  });

  document.querySelectorAll('.slot').forEach(function(s) {
    s.addEventListener('click', function() {
      if (selectedIndex === null) return;
      var key = s.id.replace('slot-', '');
      slotState[key] = selectedIndex;
      var fill = s.querySelector('.fill');
      fill.style.backgroundImage = "url(" + colors[selectedIndex] + ")";
      fill.classList.add('filled');
    });
  });

  var poemBox = document.getElementById('poem-box');

  document.getElementById('btn-decifra').addEventListener('click', function() {
    var match = combinazioni.find(function(c) {
      return (c.luna === undefined || c.luna === slotState.luna) &&
             (c.mercurio === undefined || c.mercurio === slotState.mercurio) &&
             (c.venere === undefined || c.venere === slotState.venere) &&
             (c.marte === undefined || c.marte === slotState.marte) &&
             (c.sole === undefined || c.sole === slotState.sole);
    });
    poemBox.classList.remove('error');
    poemBox.innerHTML = '';
    if (match) {
      if (match.immagine) {
        var img = document.createElement('img');
        img.src = match.immagine;
        img.className = 'poem-image';
        poemBox.appendChild(img);
      } else {
        poemBox.textContent = match.poesia;
      }
    } else {
      poemBox.classList.add('error');
      poemBox.textContent = "La combinazione non corrisponde a nessuna poesia.";
    }
    poemBox.classList.add('visible');
  });

  document.getElementById('btn-reset').addEventListener('click', function() {
    Object.keys(slotState).forEach(function(k) { slotState[k] = null; });
    document.querySelectorAll('.slot .fill').forEach(function(f) {
      f.style.backgroundImage = "none";
      f.classList.remove('filled');
    });
    dots.forEach(function(x) { x.classList.remove('selected'); });
    selectedIndex = null;
    poemBox.classList.remove('visible', 'error');
    poemBox.textContent = "";
    poemBox.innerHTML = "";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("serviceworker.js");
    });
  }
</script>
</body>
</html>
